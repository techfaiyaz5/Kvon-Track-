# =====================================================
# KvonTrack - AWS Production Deployment
# =====================================================

# 1. Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kvontrack-gemini
spec:
  replicas: 2  # MySQL RDS hai to 2 replicas safe hain
  selector:
    matchLabels:
      app: kvontrack-gemini
  template:
    metadata:
      labels:
        app: kvontrack-gemini
    spec:
      containers:
      - name: kvontrack-gemini
        # ⚠️ APNA AWS_ACCOUNT_ID YAHAN DAALO (ECR URI)
        # Format: <AWS_ACCOUNT_ID>.dkr.ecr.ap-south-1.amazonaws.com/kvontrack-gemini:latest
        image: YOUR_AWS_ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/kvontrack-gemini:latest
        ports:
        - containerPort: 5000
        env:
        # Timezone India
        - name: TZ
          value: "Asia/Kolkata"
        # RDS MySQL URL — Kubernetes Secret se aayegi
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: kvontrack-secrets
              key: DATABASE_URL
        # Flask Secret Key — Kubernetes Secret se aayegi
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: kvontrack-secrets
              key: SECRET_KEY
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "512Mi"
---
# 2. Service — LoadBalancer (AWS automatically public IP dega)
apiVersion: v1
kind: Service
metadata:
  name: kvontrack-gemini-service
spec:
  type: LoadBalancer
  selector:
    app: kvontrack-gemini
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
---
# 3. HPA (Horizontal Pod Autoscaler)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kvontrack-gemini-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kvontrack-gemini
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50